name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRTLB_WERROR=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build -j
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="rtlb-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${name}"
          cp build/rtlb README.md LICENSE CHANGELOG.md "dist/${name}/"
          cp -r examples "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.arch }}
          path: "*.tar.gz"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
      - name: Checksums and notes
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            /^## \[/ { found = 0 }
            found' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" *.tar.gz SHA256SUMS
          --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
